name: automation
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [create-pr, approve-pr]
        required: true
      head:
        type: string
        required: false
      base:
        type: string
        required: false
      title:
        type: string
        required: false
      body:
        type: string
        required: false
      number:
        type: string
        required: false
permissions:
  contents: read
  pull-requests: write
jobs:
  automation:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Perform one explicitly dispatched experimental PR operation
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          inputs=event['inputs'];repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='joshlf/gherrit-native-stack-experiments-2026-11-08'
          op=inputs['operation'];notice="*Authored by an AI agent acting on joshlf's behalf.*"
          if op=='create-pr':
            head=inputs['head'];base=inputs['base']
            assert head.startswith(('exp/fu2/ci/',))
            assert base.startswith(('exp/fu2/ci/',))
            body=inputs.get('body') or 'Synthetic PR for native-stack experiments.'
            if notice not in body:body+='\n\n'+notice
            payload={'head':head,'base':base,'title':inputs.get('title') or 'Experimental PR fixture','body':body}
            path=f'repos/{repo}/pulls'
          elif op=='approve-pr':
            number=int(inputs['number']);assert number>0
            pr=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/pulls/{number}'],text=True))
            assert pr['head']['ref'].startswith(('exp/fu2/ci/',))
            payload={'event':'APPROVE','body':'Experimental approval to measure native review behavior; not a production code review.\n\n'+notice}
            path=f'repos/{repo}/pulls/{number}/reviews'
          else:raise RuntimeError('Unsupported operation')
          Path('evidence/intent.json').write_text(json.dumps({'operation':op,'path':path,'payload':payload},indent=2)+'\n')
          p=Path('evidence/request.json');p.write_text(json.dumps(payload))
          result=subprocess.run(['gh','api','-X','POST',path,'--input',str(p)],text=True,capture_output=True)
          Path('evidence/response.json').write_text(result.stdout)
          Path('evidence/stderr.txt').write_text(result.stderr)
          print('Operation',op,'exit',result.returncode)
          if result.returncode==0:
            data=json.loads(result.stdout);print(json.dumps({k:data.get(k) for k in ['number','id','html_url','state']},indent=2))
          raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: automation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
