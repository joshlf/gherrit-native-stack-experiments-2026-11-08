name: observe
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture event and actual Git state
        shell: bash
        run: |
          mkdir -p evidence
          cp "$GITHUB_EVENT_PATH" evidence/event.json
          python3 - <<'PYCODE'
          import json,os,subprocess,sys,platform
          from pathlib import Path
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          keys=['GITHUB_EVENT_NAME','GITHUB_SHA','GITHUB_REF','GITHUB_HEAD_REF','GITHUB_BASE_REF','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_WORKFLOW','RUNNER_OS','RUNNER_ARCH']
          d={'env':{k:os.environ.get(k) for k in keys},'python':sys.version,'platform':platform.platform(),'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parents':git('rev-list','--parents','-n','1','HEAD'),'graph':git('log','--all','--format=%H %P %s','-n','30')}
          Path('evidence/context.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d,indent=2))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: event-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
